# Static analysis configuration for Radio ISDB.
# Run with `flutter analyze`. Docs: https://dart.dev/lints
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Treat these as build-breaking to keep the codebase clean.
    invalid_annotation_target: ignore # noise from json_serializable
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/generated/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_empty_else
    - avoid_relative_lib_imports
    - avoid_unused_constructor_parameters
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - use_build_context_synchronously
